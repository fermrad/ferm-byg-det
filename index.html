<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bygget på standen i dag</title>
<link rel="stylesheet" href="assets/ferm.css">
<style>
.list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:24px}
.item{display:grid;grid-template-columns:1fr 112px;gap:14px;align-items:start}
.item a{color:var(--ink);text-decoration:none}
.item h2{font-size:21px;margin:0 0 6px}
.item .qr{background:#fff;padding:6px;border-radius:6px;width:112px;height:112px}
.item .qr img,.item .qr canvas{width:100px!important;height:100px!important}
.by{font-size:14px;color:var(--muted);margin-top:8px}
.top{border-left:6px solid var(--supply)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bygget på standen i dag</h1>
  <p class="muted">Foreslå en idé. Vi bygger den på 10 minutter. Scan koden og tag den med hjem.</p>
  <div class="list" id="list"><p class="muted">Henter …</p></div>
</div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){
  const r=await fetch("features.json?"+Date.now()); const f=await r.json();
  const box=document.getElementById("list");
  box.innerHTML=f.map((x,i)=>`<div class="card item${i===0?" top":""}">
    <div><a href="features/${esc(x.slug)}/"><h2>${esc(x.titel)}</h2></a>
    <div class="muted">${esc(x.beskrivelse)}</div>
    <div class="by">Foreslået af ${esc(x.foreslaaet_af)} kl. ${esc(x.tid)}</div></div>
    <div class="qr" id="qr-${i}"></div></div>`).join("");
  f.forEach((x,i)=>{ if(window.QRCode) new QRCode(document.getElementById("qr-"+i),{text:(window.FERM_BASE_URL||location.href)+"features/"+x.slug+"/",width:100,height:100,correctLevel:QRCode.CorrectLevel.M}); });
}
load(); setInterval(load,30000);
</script>
</body>
</html>
